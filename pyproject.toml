[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "phishguard-finetune"
version = "0.1.0"
description = "Leakage-aware phishing-email classification with a linear baseline and CPU LoRA"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.6,<2", "pandas>=2.2,<4", "joblib>=1.4,<2", "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]
[project.optional-dependencies]
ml = ["torch>=2.6,<3", "transformers>=4.50,<6", "peft>=0.15,<1", "accelerate>=1.0,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[project.scripts]
phishguard = "phishguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
